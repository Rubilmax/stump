name: Binary release

on:
  # only runs when a release/v* branch is merged into main (resolve-version step)
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-22.04
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.head.ref, 'release/v'))
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version=$INPUT_VERSION
          else
            version=${HEAD_REF#release/v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Print version
        run: echo "Building release for v${{ steps.resolve.outputs.version }}"

  # build the common webapp HTML/JS/CSS used for all platforms
  build-webapp:
    needs: [resolve-version]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build web application/upload artifact
        uses: ./.github/actions/build-web

  # build the server binary for each supported platform
  build-binary:
    needs: [resolve-version]
    strategy:
      matrix:
        # See https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
        # Note: macos-15-intel is x86_64, available until Aug 2027. See https://github.com/actions/runner-images/issues/13045
        os: [ubuntu-22.04, macos-15-intel, macos-latest, windows-latest]
        include:
          - os: ubuntu-22.04
            artifact_name: linux-artifact
            artifact_filename: stump_server
          - os: macos-15-intel
            artifact_name: macos-intel-artifact
            artifact_filename: stump_server
          - os: macos-latest
            artifact_name: macos-arm-artifact
            artifact_filename: stump_server
          - os: windows-latest
            artifact_name: windows-artifact
            artifact_filename: stump_server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build stump server
        uses: ./.github/actions/build-server

      - name: Upload server artifact
        uses: ./.github/actions/upload-artifact
        with:
          upload-name: ${{ matrix.artifact_name }}
          upload-path: target/release/${{ matrix.artifact_filename }}

  # create the release and attach the platform artifacts
  create-release:
    needs: [resolve-version, build-webapp, build-binary]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download server artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-artifact'

      - name: Download web application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: webapp
          path: webapp

      - name: Zip artifacts
        run: |
          cp -R webapp linux-artifact/client
          cp -R webapp macos-intel-artifact/client
          cp -R webapp macos-arm-artifact/client
          cp -R webapp windows-artifact/client
          cd linux-artifact && zip -r ../linux-build-results.zip ./* && cd ..
          cd macos-intel-artifact && zip -r ../macos-intel-build-results.zip ./* && cd ..
          cd macos-arm-artifact && zip -r ../macos-arm-build-results.zip ./* && cd ..
          cd windows-artifact && zip -r ../windows-build-results.zip ./* && cd ..

      - name: Create release and upload artifacts
        run: |
          gh release create "v$VERSION" \
            --draft \
            --target main \
            --title "v$VERSION" \
            --generate-notes \
            "linux-build-results.zip#StumpServer-$VERSION-linux-x86_64.zip" \
            "macos-intel-build-results.zip#StumpServer-$VERSION-macos-intel.zip" \
            "macos-arm-build-results.zip#StumpServer-$VERSION-macos-arm.zip" \
            "windows-build-results.zip#StumpServer-$VERSION-windows-x86_64.zip"
