name: 'Build docker image'
description: 'Build and load or push a tagged docker image for stump'

inputs:
  username:
    description: 'Username for docker login'
    required: true
  password:
    description: 'Token for docker login'
    required: true
  push:
    description: 'Set output-type to registry'
    default: 'false'
  tags:
    description: 'List of tags to assigned to the image'
    default: 'nightly'
  build-channel:
    description: 'Build channel identifier (e.g., stable, nightly, unstable)'
    required: false
    default: ''
  archs:
    description: 'List of platforms to build'
    required: true
  discord-webhook:
    description: 'Discord webhook to send notifications to'
    required: true

runs:
  using: composite
  steps:
    - name: Configure build
      env:
        INPUT_TAGS: ${{ inputs.tags }}
      run: |
        echo "GIT_REV=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
        echo "FORMATTED_TAGS=${INPUT_TAGS//,/ }" >> "$GITHUB_ENV"
      shell: bash

    # We only need QEMU when an arm* platform is targeted
    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      if: ${{ contains(inputs.archs, 'arm') }}
      with:
        platforms: linux/arm64

    - name: Install podman and buildah
      if: runner.environment != 'self-hosted'
      run: |
        sudo apt-get update
        sudo apt-get install -y podman buildah
      shell: bash

    - name: Remove existing images and manifests
      run: |
        podman images --format "{{.Repository}}:{{.Tag}}" \
          | grep "^localhost/stump:" \
          | xargs -r podman rmi --force 2>/dev/null || true

        for tag in ${{ env.FORMATTED_TAGS }}; do
          buildah manifest rm "stump:$tag" 2>/dev/null || true
        done
      shell: bash

    - name: Run buildah build
      id: build
      uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
      with:
        image: stump
        tags: ${{ env.FORMATTED_TAGS }}
        archs: ${{ inputs.archs }}
        build-args: |
          GIT_REV=${{ env.GIT_REV }}
          BUILD_CHANNEL=${{ inputs.build-channel }}
        labels: |
          org.opencontainers.image.revision=${{ env.GIT_REV }}
        containerfiles: |
          ./docker/Dockerfile
        layers: true

    - name: Push to registry
      id: push
      if: ${{ success() && inputs.push == 'true' }}
      uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
      with:
        image: ${{ steps.build.outputs.image }}
        tags: ${{ steps.build.outputs.tags }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        registry: docker.io/aaronleopold

    - name: Discord notification
      if: ${{ success() && inputs.push == 'true' && inputs.discord-webhook != '' }}
      env:
        DISCORD_WEBHOOK: ${{ inputs.discord-webhook }}
      uses: 'Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554' # 0.4.0
      with:
        args: 'Successfully pushed the following image tags to registry: ${{ steps.build.outputs.tags }}'
